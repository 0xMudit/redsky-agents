<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Red Sky · AI Teammates</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Red Sky · AI Teammates" />
    <meta property="og:description" content="Grok Bot–style local AI teammates that run entirely on your machine." />
    <meta property="og:image" content="/favicon.png" />

    <meta name="description" content="Grok Bot–style local AI teammates that run entirely on your machine. Powered by OpenCode." />

    <!-- Apply stored mode, base theme and UI scale before first paint so the
         app never flashes the wrong substrate/size. Mirrors applyMode(),
         applyBase() and applyScale() in ui.tsx. -->
    <script>
      try {
        var m = localStorage.getItem('redsky.mode')
        document.documentElement.dataset.mode = m === 'light' || m === 'dark' ? m : 'dark'
        var bases = ['supabase', 'notebook', 'mono', 'sage-garden', 'catppuccin', 'amber-minimal', 'claude', 't3-chat']
        var b = localStorage.getItem('redsky.base')
        document.documentElement.dataset.base = bases.indexOf(b) >= 0 ? b : 'supabase'
        var s = parseFloat(localStorage.getItem('redsky.scale'))
        if (isFinite(s) && s >= 0.9 && s <= 1.4 && Math.abs(s - 1) > 0.001) {
          document.documentElement.style.zoom = String(s)
        }
      } catch (e) {
        document.documentElement.dataset.mode = 'dark'
        document.documentElement.dataset.base = 'supabase'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
