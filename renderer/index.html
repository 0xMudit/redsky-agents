<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Red Sky · AI Teammates</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Red Sky · AI Teammates" />
    <meta property="og:description" content="Grok Bot–style local AI teammates that run entirely on your machine." />
    <meta property="og:image" content="/favicon.png" />

    <meta name="description" content="Grok Bot–style local AI teammates that run entirely on your machine. Powered by OpenCode." />

    <!-- Apply the stored colour mode before first paint so the Notebook theme
         never flashes the wrong substrate. Mirrors applyMode() in ui.tsx. -->
    <script>
      try {
        var m = localStorage.getItem('redsky.mode')
        document.documentElement.dataset.mode = m === 'light' || m === 'dark' ? m : 'dark'
      } catch (e) {
        document.documentElement.dataset.mode = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
